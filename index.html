<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema Web de Facturación - Mini POS</title>
  <style>
    body { font-family: Arial; background: #f0f4f8; padding: 20px; }
    h3 { color: #2c3e50; }
    button {
      padding: 10px 20px; margin: 6px;
      background: #3498db; border: none; color: white;
      border-radius: 5px; cursor: pointer;
    }
    button:hover { background: #2980b9; }
    #output {
      background: white; border-radius: 10px; padding: 20px;
      margin-top: 20px; border: 2px solid #ccc; min-height: 80px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: center; }
  </style>
</head>
<body>

  <h3>Sistema Web de Facturación (Mini POS)</h3>

  <p>Carrito actual: <strong id="arrayActual">[]</strong></p>

  <button onclick="agregarProducto()">Agregar Producto</button>
  <button onclick="eliminarUltimo()">Eliminar Último</button>
  <button onclick="ordenarAsc()">Ordenar por Precio</button>
  <button onclick="buscarProducto()">Buscar Producto</button>
  <button onclick="calcularTotal()">Calcular Total</button>

  <div id="output">Aquí voy a mostrar los resultados...</div>

  <script src="script.js"></script>
</body>
</html>
